[package]
name = "blocks-tool"
description = "Creates and manages Felix Blocks worlds"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "blocks-tool"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
felix-blocks-core = { path = "../core" }
felix-client = "=0.6.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.10"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
